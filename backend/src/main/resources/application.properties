server.port=${PORT:9090}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/internmatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
app.jwt-secret=${JWT_SECRET:change-me-to-a-long-random-secret-of-32+chars}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL:}
app.serpapi-key=${SERPAPI_KEY:}
